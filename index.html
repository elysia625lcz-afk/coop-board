<title>Co-op 投递台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: drafting-table workspace. Board = parts schedule of postings; job view = requirement terminal strip (left) beside a paper resume sheet (right). */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --sunk:#e9ebe6; --ink:#1a2028; --muted:#5b6570; --line:#d9ddd5;
  --accent:#2557cf; --accent-soft:#e3eafb; --accent-ink:#ffffff;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6300; --warn-soft:#f9eed6; --bad:#b33d2c; --bad-soft:#f7e1dc;
  --paper:#fdfdfb; --paper-ink:#111418; --paper-muted:#4a525b; --paper-line:#c9cdc6; --lit:#fff1a8;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --resume:Arial,Helvetica,"Liberation Sans",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1b1f26; --sunk:#232830; --ink:#e6e9ee; --muted:#9aa3ae; --line:#2d333c;
  --accent:#86a6ff; --accent-soft:#1e2944; --accent-ink:#0d1220;
  --ok:#6cc48e; --ok-soft:#163023; --warn:#e3b45c; --warn-soft:#382a10; --bad:#ff8b79; --bad-soft:#3b1d18;
  --paper:#f7f7f3; --paper-ink:#111418; --paper-muted:#4a525b; --paper-line:#c9cdc6; --lit:#ffe98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --sunk:#232830; --ink:#e6e9ee; --muted:#9aa3ae; --line:#2d333c;
  --accent:#86a6ff; --accent-soft:#1e2944; --accent-ink:#0d1220;
  --ok:#6cc48e; --ok-soft:#163023; --warn:#e3b45c; --warn-soft:#382a10; --bad:#ff8b79; --bad-soft:#3b1d18;
  --paper:#f7f7f3; --paper-ink:#111418; --paper-muted:#4a525b; --paper-line:#c9cdc6; --lit:#ffe98a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.brand small{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.runline{margin-left:auto;font:12.5px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.runline b{color:var(--ink);font-weight:500}
main{padding-block:20px 60px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.notice{border-radius:8px;padding:10px 14px;font-size:14px}
.ana{padding:12px 16px 14px;display:grid;gap:12px;font-size:14px}
.ana h4{margin:0 0 4px;font-size:14.5px}
.ana ul{margin:0;padding-left:18px;display:grid;gap:3px}
.ana .verdict{font-weight:600;font-size:15px}
.edu{display:grid;gap:6px;margin-top:8px}
.edu .lab{font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.85}
.edu blockquote{margin:0;padding:6px 10px;border-left:3px solid currentColor;background:var(--surface,#fff);color:var(--ink);border-radius:0 6px 6px 0;font-size:14px;line-height:1.45}
.edu details{font-size:13px;opacity:.9}.edu summary{cursor:pointer}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--accent-soft);color:var(--accent)}

/* board */
.summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.summary .stat{display:flex;flex-direction:column;padding:8px 14px;border-left:3px solid var(--line);min-width:84px}
.summary .stat b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.summary .stat span{font-size:12.5px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.controls label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.controls select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px}
.row:hover{border-color:var(--accent)}
.row.expired{opacity:.62}
.row.expired:hover{opacity:1}
.listsep{margin:6px 2px 0;font-size:13px;font-weight:600;color:var(--muted)}
.dial{width:64px;height:64px;position:relative;display:grid;place-items:center}
.dial svg{position:absolute;inset:0}
.dial b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.dial i{position:absolute;bottom:-6px;font:normal 10px var(--mono);color:var(--muted);background:var(--surface);padding:0 3px}
.row h3{margin:0 0 2px;font-size:16.5px;line-height:1.35;text-wrap:balance}
.row .co{font-weight:600;color:var(--muted);font-size:14px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row .act{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:6px;letter-spacing:.03em}
.pill.new{background:var(--accent-soft);color:var(--accent)} .pill.reviewing{background:var(--warn-soft);color:var(--warn)} .pill.approved{background:var(--ok-soft);color:var(--ok)} .pill.applied{background:var(--ok);color:#fff} .pill.skipped{background:var(--sunk);color:var(--muted)}
details.box{margin-top:18px}
details.box>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.box>summary::before{content:"▸";font-family:var(--mono);color:var(--muted);transition:transform .15s}
details.box[open]>summary::before{transform:rotate(90deg)}
.excl{padding:0 16px 14px;display:grid;gap:8px}
.excl div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.qs{padding:0 16px 16px;display:grid;gap:14px}
.q{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.q .why{font-size:13px;color:var(--muted)}
.q textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical}
.q .qa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* job view */
.jobhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;margin-bottom:16px}
.jobhead h2{margin:0;font-size:22px;line-height:1.3;text-wrap:balance}
.jobhead .co{color:var(--muted);font-weight:600}
.jobhead .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.facts{padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pathbox{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:7px;padding:6px 8px;font:12px var(--mono);overflow-wrap:anywhere}
.pathbox span{min-width:0;flex:1}
.score{padding:14px 16px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.reqs{padding:6px 0 10px}
.reqs h4{margin:12px 16px 6px;font:600 12px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.req{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:8px 16px 8px 12px;border-left:4px solid transparent;cursor:default;transition:background .12s}
.req.strong{border-left-color:var(--ok)} .req.partial{border-left-color:var(--warn)} .req.gap{border-left-color:var(--bad)}
.req .id{font:600 12px var(--mono);padding-top:2px}
.req.strong .id{color:var(--ok)} .req.partial .id{color:var(--warn)} .req.gap .id{color:var(--bad)}
.req .tx{font-size:14.5px}
.req .nt{font-size:13px;color:var(--muted);margin-top:2px}
.req .cov{font:11.5px var(--mono);margin-top:3px}
.req .cov.yes{color:var(--ok)} .req .cov.no{color:var(--muted)}
.req.lit,.req:hover{background:var(--accent-soft)}

.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.tool select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;max-width:220px}
.tool .sp{flex:1}
.sheetwrap{background:var(--sunk);border-radius:var(--r);padding:14px}
.paper{container-type:inline-size;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.06);border-radius:2px}
.paper .pg{font-family:var(--resume);font-size:calc(100cqw * 10 / 612);line-height:1.28;padding:4em 4.2em;min-height:calc(100cqw * 11 / 8.5)}
.paper .ltr{font-family:var(--resume);font-size:calc(100cqw * 10.5 / 612);line-height:1.42;padding:5em 5.6em}
.ltr p{margin:0 0 .95em}
.ltr .lh b{font-size:1.5em}
.ltr .lh{border-bottom:1.2px solid var(--paper-ink);padding-bottom:.5em;margin-bottom:1.4em}
.ltr .lh span{display:block;color:var(--paper-muted);font-size:.92em;margin-top:.2em}
.pg .nm{font-size:1.9em;font-weight:700;letter-spacing:.01em;line-height:1.1}
.pg .ct{font-size:.92em;color:var(--paper-muted);margin-top:.3em;padding-bottom:.6em;border-bottom:1.4px solid var(--paper-ink)}
.pg h5{font-size:1.02em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:1.05em 0 .35em;padding-bottom:.15em;border-bottom:.6px solid var(--paper-line)}
.pg ul{margin:0;padding-left:1.15em}
.pg li{margin:.12em 0}
.pg .sk{margin:.12em 0}
.pg .sm{margin-top:.7em}
.pg .pn{color:var(--paper-muted);font-style:italic;margin-bottom:.1em}
.pg .sk b{font-weight:700}
.pg .pt{margin:.55em 0 .1em}
.pg .pt b{font-weight:700}
.pg .pt span{color:var(--paper-muted)}
.pg .er{display:flex;justify-content:space-between;gap:1em;margin-top:.15em}
.pg .er b{font-weight:700}
.pg [data-r]{border-radius:2px;transition:background .12s}
.pg [data-r].lit{background:var(--lit)}
.pg [data-r]:hover{background:var(--lit)}
.pg .diffnew{background:#d9f2df}
.fit{font:12px var(--mono);margin-top:8px}
.chat{padding:12px 14px;display:grid;gap:10px}
.chat textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);resize:vertical}
.chat .row2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chat label{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.reply{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap}
.diff{display:grid;gap:6px;font-size:13px}
.diff div{display:grid;gap:2px;border-top:1px dashed var(--line);padding-top:6px}
.diff del{color:var(--bad);text-decoration:line-through} .diff ins{color:var(--ok);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.jobtop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:16px}
@media (min-width: 961px){.split>.col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:calc(100vh - 72px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}}
@media (max-width: 960px){.split{grid-template-columns:minmax(0,1fr)}.jobtop{grid-template-columns:minmax(0,1fr)}}
@media (max-width: 620px){
  .row{grid-template-columns:56px minmax(0,1fr)}
  .row .act{grid-column:1/-1;flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
  .dial{width:52px;height:52px}
  .excl div{grid-template-columns:minmax(0,1fr)}
  .runline{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Co-op 投递台 <small>CHENGZHANG LYU · EET · 2027</small></div>
  <div class="runline" id="runline"><span>读取数据中…</span></div>
</div></header>

<main class="wrap" id="app">
  <div class="empty" id="boot">正在连接岗位数据库。岗位、简历和你的审核状态都存在这里，Claude 每周五晚上会往里加新岗位。</div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="backend.js"></script>
<script>
(() => {
"use strict";
const S = { jobs: {}, resumes: {}, meta: {}, questions: {}, requests: {}, letters: {}, analysis: {}, loaded: false,
  sort: "match", fStatus: "all", fRegion: "all", fElig: "all", fSrc: "all", hideSkipped: true, hideExpired: true, showTags: false, boxOpen: {} };
const ST = { new: "新", reviewing: "待修改", approved: "已通过", applied: "已投递", skipped: "跳过" };
const LVL = { strong: "有证据", partial: "部分", gap: "缺口" };
const KIND = { duty: "职责", req: "必需条件", asset: "加分项" };
const SRC = { school: "学校门户", linkedin: "LinkedIn", indeed: "Indeed", site: "公司官网" };
function srcOf(j) {
  const s = (j.source || "") + " " + (j.url || "");
  return /Experience Centennial|学校门户|experience\.centennialcollege/i.test(s) ? "school"
    : /linkedin/i.test(s) ? "linkedin" : /indeed/i.test(s) ? "indeed" : "site";
}
function me(k){ const p=(S.meta&&S.meta.profile)||{}; return k===2 ? (p.file||"Resume") : k===1 ? (p.short||p.name||"the candidate") : (p.name||"the candidate"); }
let db = null, sample = null, dl = null, chatCtl = null, pending = null;
/* generation jobs keep running when you leave a job page; their state lives here so the page shows it when you come back */
const BUSY = {}, ERR = {};
const isBusy = (id, k) => !!(BUSY[id] && BUSY[id][k]);
function setBusy(id, k, on) { BUSY[id] = { ...(BUSY[id] || {}), [k]: on }; }
function setErr(id, k, msg) { ERR[id] = { ...(ERR[id] || {}), [k]: msg || "" }; }
const errLine = (id, k) => ERR[id] && ERR[id][k] ? `<div style="color:var(--bad);font-size:13px">上次生成没成功：${esc(ERR[id][k])}</div>` : "";
const ERRMSG = { cancelled: "已停止", not_granted: "没有授权网页调用 Claude", rate_limited: "调用太频繁或额度用完，稍后再试", invalid_json: "返回的格式没法读，再点一次", shape: "返回的格式不对，再点一次" };
const errText = e => ERRMSG[e && e.code] || ("出错了：" + ((e && (e.message || e.code)) || ""));
const jobName = id => (S.jobs[id] ? S.jobs[id].company : id);
function needsLetter(j) { const t = [(j.flags || []).join(" "), j.source || ""].join(" "); return /cover letter/i.test(t) && !/optional/i.test(t); }
/* save a generated resume: first one becomes the current version; later ones are kept as a draft until you adopt or discard */
async function saveGenerated(id, res, meta) {
  const rd = S.resumes[id];
  if (!rd || !rd.current) {
    const day = new Date().toLocaleDateString("zh-CN");
    await db.collection("resumes").doc(id).set({ jobId: id, current: res.resume, history: [], version_label: `v1 ${day} ${meta.label}`, review: "pending", firstReply: meta.reply || "" });
    await markReqs(meta.reqIds || [], meta.notDone || []);
    return "saved";
  }
  await db.collection("resumes").doc(id).update({ draft: { resume: res.resume, reply: meta.reply || "", label: meta.label, reqIds: meta.reqIds || [], notDone: meta.notDone || [], at: new Date().toISOString() } });
  return "draft";
}
async function markReqs(ids, notDone) {
  const day = new Date().toLocaleDateString("zh-CN"), nd = new Map((notDone || []).map(x => [x.id, x.why || "做不到"]));
  for (const rid of ids) { try { await db.collection("requests").doc(rid).update(nd.has(rid) ? { status: "failed", reply: nd.get(rid) } : { status: "done", reply: "已改进简历（" + day + "）" }); } catch (e) {} }
}
try { const s = localStorage.getItem("coopboard.prefs"); if (s) Object.assign(S, JSON.parse(s)); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem("coopboard.prefs", JSON.stringify({ sort: S.sort, fStatus: S.fStatus, fRegion: S.fRegion, fElig: S.fElig, fSrc: S.fSrc, hideSkipped: S.hideSkipped, hideExpired: S.hideExpired, showTags: S.showTags, boxOpen: S.boxOpen })); } catch (e) {} };

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
function daysAgo(d) { if (!d) return ""; const n = Math.round((Date.now() - new Date(d + "T12:00:00")) / 864e5); return n <= 0 ? "今天" : n + " 天前"; }
function daysLeft(d) { const n = Math.ceil((new Date(d + "T23:59:00") - Date.now()) / 864e5); return n; }
/* deadline with optional time (j.deadlineTime "HH:MM", local); no time = end of that day */
function dlAt(j) { return j.deadline ? new Date(j.deadline + "T" + (j.deadlineTime || "23:59") + ":00") : null; }
function isExpired(j) { const t = dlAt(j); return !!t && t.getTime() < Date.now(); }
function fmtClock(t) {
  if (!t) return ""; const [h, m] = t.split(":").map(Number); const mm = String(m).padStart(2, "0");
  if (h === 23 && m === 59) return "晚上 11:59";

      lines.forEach((L, i) => { let x = x0 + (i === 0 ? indentFirst : 0); if (draw) L.forEach(it => { font(it.b); doc.setTextColor(it.c || 0); doc.text(it.w, x, y); x += it.ww; }); y += lh; });
    };
    const heading = t => { y += fs * 0.55; font(true, fs * 1.02); if (draw) { doc.setTextColor(0); doc.setCharSpace(0.9); doc.text(t.toUpperCase(), M, y); doc.setCharSpace(0); doc.setDrawColor(150); doc.setLineWidth(0.5); doc.line(M, y + 3, W - M, y + 3); } y += fs * 1.35; };
    const bullet = (t, ind = 11) => { if (draw) { font(false); doc.setTextColor(0); doc.text("•", M + 2, y); } wrapSegs([{ t }], M + ind, CW - ind); y += fs * 0.08; };
    const rightLine = (left, right) => { const yy = y; wrapSegs(left, M, CW - 120); if (draw) { font(false); doc.setTextColor(60); doc.text(clean(right), W - M, yy, { align: "right" }); } };
    // header
    font(true, fs * 1.9); y += fs * 1.2; if (draw) { doc.setTextColor(0); doc.text(clean(r.header?.name), M, y); } y += fs * 1.25;
    font(false, fs * 0.92); if (draw) { doc.setTextColor(70); doc.text(clean(r.header?.line), M, y); } y += fs * 0.55;
    if (draw) { doc.setDrawColor(0); doc.setLineWidth(1.1); doc.line(M, y, W - M, y); } y += fs * 0.6;
    if (r.summary) { y += fs * 0.9; wrapSegs([{ t: r.summary }], M, CW); y -= fs * 0.3; }
    const e = r.education || {};
    heading("Education");
    rightLine([{ t: e.school + ", ", b: true }, { t: e.place }], e.dates);
    wrapSegs([{ t: e.program + "  |  " + e.gpa }], M, CW);
    wrapSegs([{ t: "Relevant coursework: ", b: true }, { t: e.coursework }], M, CW);
    if ((r.highlights || []).length) { heading("Highlights"); r.highlights.forEach(h => bullet(h.t)); }
    heading("Technical Skills"); (r.skills || []).forEach(s => wrapSegs([{ t: s.k + ": ", b: true }, { t: s.v }], M, CW));
    heading("Projects & Lab Experience");
    if (r.projectsNote) wrapSegs([{ t: r.projectsNote, c: 70 }], M, CW);
    (r.projects || []).forEach((p, i) => { if (i) y += fs * 0.25; wrapSegs([{ t: p.title + " ", b: true }, { t: "| " + p.course + " | " + p.tools, c: 70 }], M, CW); (p.bullets || []).forEach(b => bullet(b.t)); });
    heading("Work Experience");
    (r.work || []).forEach(w => { rightLine([{ t: w.org, b: true }, { t: " | " + w.role + ", " + w.place }], w.dates); (w.bullets || []).forEach(b => bullet(b.t)); });
    heading("Additional"); (r.additional || []).forEach(a => bullet(a));
    return { doc, y };
  }
  let fs = 10;
  while (fs > 8.2 && run(fs, false).y > H - M + 4) fs -= 0.2;
  return run(fs, true).doc.output("blob");
}

/* ---------- DOCX ---------- */
async function buildDocx(r) {
  const d = window.docx; if (!d) throw { message: "Word 组件没加载" };
  const { Document, Packer, Paragraph, TextRun, TabStopType, BorderStyle } = d;
  const SZ = 20, F = "Arial", RIGHT = 10500;
  const T = (text, o = {}) => new TextRun({ text, font: F, size: o.size || SZ, bold: !!o.bold, color: o.color });
  const P = (children, o = {}) => new Paragraph({ children, spacing: { after: o.after ?? 30, before: o.before ?? 0 }, tabStops: [{ type: TabStopType.RIGHT, position: RIGHT }], ...(o.extra || {}) });
  const H = t => new Paragraph({ children: [T(t.toUpperCase(), { bold: true, size: 21 })], spacing: { before: 140, after: 50 }, border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: "999999", space: 1 } } });
  const B = t => new Paragraph({ children: [T(t)], bullet: { level: 0 }, spacing: { after: 20 } });
  const e = r.education || {};
  const kids = [
    P([T(r.header?.name || "", { bold: true, size: 38 })], { after: 20 }),
    P([T(r.header?.line || "", { size: 18, color: "444444" })], { after: 60, extra: { border: { bottom: { style: BorderStyle.SINGLE, size: 10, color: "000000", space: 4 } } } }),
    ...(r.summary ? [P([T(r.summary)], { before: 80 })] : []),
    H("Education"),
    P([T((e.school || "") + ", ", { bold: true }), T(e.place || ""), T("\t" + (e.dates || ""))]),
    P([T((e.program || "") + "  |  " + (e.gpa || ""))]),
    P([T("Relevant coursework: ", { bold: true }), T(e.coursework || "")]),
    ...((r.highlights || []).length ? [H("Highlights"), ...r.highlights.map(h => B(h.t))] : []),
    H("Technical Skills"), ...(r.skills || []).map(s => P([T(s.k + ": ", { bold: true }), T(s.v)])),
    H("Projects & Lab Experience"),
    ...(r.projectsNote ? [P([T(r.projectsNote, { color: "444444" })])] : []),
    ...(r.projects || []).flatMap(p => [P([T(p.title + " ", { bold: true }), T("| " + p.course + " | " + p.tools, { color: "444444" })], { before: 60 }), ...(p.bullets || []).map(b => B(b.t))]),
    H("Work Experience"),
    ...(r.work || []).flatMap(w => [P([T(w.org, { bold: true }), T(" | " + w.role + ", " + w.place), T("\t" + w.dates)]), ...(w.bullets || []).map(b => B(b.t))]),
    H("Additional"), ...(r.additional || []).map(a => B(a)),
  ];
  const doc = new Document({ styles: { default: { document: { run: { font: F, size: SZ } } } },
    sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 760, bottom: 760, left: 860, right: 860 } } }, children: kids }] });
  return Packer.toBlob(doc);
}

boot();
})();
